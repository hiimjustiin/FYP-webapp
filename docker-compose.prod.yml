version: "3.8"

# Production overrides for docker-compose.yml
services:
  postgres:
    environment:
      # Use the same POSTGRES_PASSWORD variable from .env file
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ila_password}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  backend:
    environment:
      NODE_ENV: production
      # Use the same JWT_SECRET variable from .env file
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
    restart: always

  frontend:
    restart: always

  # Remove pgAdmin from production
  pgadmin:
    profiles:
      - dev-tools

volumes:
  postgres_prod_data:
    driver: local

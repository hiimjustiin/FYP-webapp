version: "3.8"

# Production overrides for docker-compose.yml
services:
  postgres:
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PRODUCTION_PASSWORD:-change-this-in-production}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    restart: always

  backend:
    environment:
      NODE_ENV: production
      JWT_SECRET: ${JWT_PRODUCTION_SECRET:-change-this-secret-in-production}
    restart: always

  frontend:
    restart: always

  # Remove pgAdmin from production
  pgadmin:
    profiles:
      - dev-tools

volumes:
  postgres_prod_data:
    driver: local

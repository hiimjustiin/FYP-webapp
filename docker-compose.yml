version: "3.8"

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ila-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ila_db}
      POSTGRES_USER: ${POSTGRES_USER:-ila_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ila_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/init:/docker-entrypoint-initdb.d
    networks:
      - ila-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-ila_user} -d ${POSTGRES_DB:-ila_db}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API (Node.js/Express)
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ila-backend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${POSTGRES_USER:-ila_user}:${POSTGRES_PASSWORD:-ila_password}@postgres:5432/${POSTGRES_DB:-ila_db}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key}
      PORT: 3001
      # Support multiple origins for development and production
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000,http://localhost:5173}
      # ADK Agent URL
      ADK_AGENT_URL: ${ADK_AGENT_URL:-http://adk-agent:8000}
      # SMTP Configuration for Email
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
    ports:
      - "${BACKEND_PORT:-3001}:3001"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - ila-network

  # Frontend (React App)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ila-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
      - "${FRONTEND_SSL_PORT:-443}:443"
    volumes:
      # Mount SSL certificates from Let's Encrypt
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
    networks:
      - ila-network

  # ADK Agent Service (Python/FastAPI)
  adk-agent:
    build:
      context: ./adk-agent
      dockerfile: Dockerfile
    container_name: ila-adk-agent
    restart: unless-stopped
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      ADK_PORT: 8000
    ports:
      - "${ADK_PORT:-8000}:8000"
    networks:
      - ila-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  ila-network:
    driver: bridge

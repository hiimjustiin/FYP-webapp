name: Lint & Type Safety

on:
  pull_request:
    branches:
      - main
      - develop
      - uat
  push:
    branches:
      - main
      - develop
      - uat

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Run ESLint (Frontend)
        run: bun lint

      - name: Run TypeScript Type Check (Frontend)
        run: bun run tsc --noEmit

      - name: Install backend dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Run TypeScript Type Check (Backend)
        working-directory: ./backend
        run: bun run tsc --noEmit

      - name: Check for TODO/FIXME comments
        run: |
          echo "Checking for critical TODO/FIXME markers..."
          if grep -r "TODO.*critical\|FIXME.*urgent" src/ backend/src/ --exclude-dir=node_modules; then
            echo "⚠️  Found critical TODOs or FIXMEs that need attention"
            exit 1
          fi
          echo "✓ No critical TODOs/FIXMEs found"

      - name: Validate package.json files
        run: |
          echo "Validating package.json..."
          bun run --bun node -e "JSON.parse(require('fs').readFileSync('package.json', 'utf8'))"
          echo "Validating backend/package.json..."
          bun run --bun node -e "JSON.parse(require('fs').readFileSync('backend/package.json', 'utf8'))"
          echo "✓ All package.json files are valid"

  security-checks:
    name: Security & Dependency Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check for known vulnerabilities
        run: |
          echo "Checking for vulnerabilities in dependencies..."
          bun audit || echo "⚠️  Vulnerabilities found - review needed"

      - name: Check for outdated dependencies
        run: |
          echo "Checking for outdated dependencies..."
          bun outdated || true

  backend-safety:
    name: Backend Safety Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: latest

      - name: Install backend dependencies
        working-directory: ./backend
        run: bun install --frozen-lockfile

      - name: Validate migrations
        working-directory: ./backend
        run: |
          echo "Checking migration files..."
          if [ ! -d "migrations" ]; then
            echo "❌ Migrations directory not found"
            exit 1
          fi

          # Check if migration files follow naming convention
          if ls migrations/*.js 1> /dev/null 2>&1; then
            echo "✓ Migration files found"
            for file in migrations/*.js; do
              if [[ ! "$file" =~ ^migrations/[0-9]+_.+\.js$ ]]; then
                echo "⚠️  Migration file $file doesn't follow naming convention"
              fi
            done
          else
            echo "No migration files found (this is OK if no schema changes)"
          fi

      - name: Check for console.log statements
        run: |
          echo "Checking for console.log in production code..."
          if grep -r "console\.log" backend/src/ --include="*.ts" --exclude-dir=node_modules | grep -v "console.error\|console.warn"; then
            echo "⚠️  Found console.log statements - consider using proper logging"
          else
            echo "✓ No problematic console.log statements found"
          fi

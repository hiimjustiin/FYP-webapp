name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # Trigger on push to main branch
  workflow_dispatch: # Allow manual trigger

env:
  EC2_HOST: 13.229.1.151
  EC2_USER: ec2-user
  DEPLOY_PATH: /home/ec2-user/ila-webapp
  DOMAIN: ila-analytics.rdc.nie.edu.sg

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "============================================"
            echo "Starting Deployment Process"
            echo "============================================"
            
            echo ""
            echo "============================================"
            echo "Step 1: System Updates"
            echo "============================================"
            sudo dnf update -y
            
            echo ""
            echo "============================================"
            echo "Step 2: Install Git"
            echo "============================================"
            if ! command -v git &> /dev/null; then
              echo "Installing Git..."
              sudo dnf install -y git
              echo "Git installed: $(git --version)"
            else
              echo "Git already installed: $(git --version)"
            fi
            
            echo ""
            echo "============================================"
            echo "Step 3: Install Docker"
            echo "============================================"
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "Docker installed: $(docker --version)"
            else
              echo "Docker already installed: $(docker --version)"
              # Ensure Docker is running
              sudo systemctl start docker || true
            fi
            
            echo ""
            echo "============================================"
            echo "Step 4: Install Docker Compose v2"
            echo "============================================"
            if sudo docker compose version &> /dev/null; then
              echo "Docker Compose already available: $(sudo docker compose version)"
            else
              echo "Docker Compose v2 not found, installing manually..."
              # Download and install Docker Compose v2 as a Docker CLI plugin
              DOCKER_CONFIG=${DOCKER_CONFIG:-/usr/local/lib/docker}
              sudo mkdir -p $DOCKER_CONFIG/cli-plugins
              sudo curl -SL https://github.com/docker/compose/releases/download/v2.29.7/docker-compose-linux-x86_64 -o $DOCKER_CONFIG/cli-plugins/docker-compose
              sudo chmod +x $DOCKER_CONFIG/cli-plugins/docker-compose
              echo "Docker Compose installed: $(sudo docker compose version)"
            fi
            
            echo ""
            echo "============================================"
            echo "Step 5: Configure Docker permissions"
            echo "============================================"
            sudo usermod -aG docker ec2-user || true
            echo "ec2-user added to docker group"
            
            echo ""
            echo "============================================"
            echo "Step 6: Create deployment directory"
            echo "============================================"
            sudo mkdir -p ${{ env.DEPLOY_PATH }}
            sudo chown -R ec2-user:ec2-user ${{ env.DEPLOY_PATH }}
            echo "Deployment directory ready: ${{ env.DEPLOY_PATH }}"
            
            echo ""
            echo "============================================"
            echo "Step 7: Clone or update repository"
            echo "============================================"
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest changes or clone repository
            if [ -d ".git" ]; then
              echo "Repository exists, pulling latest changes..."
              # Update remote URL to use token for authentication
              git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
              git fetch origin
              git reset --hard origin/main
              git pull origin main
            else
              echo "Cloning repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            
            echo ""
            echo "============================================"
            echo "Step 8: Set up environment variables"
            echo "============================================"
            echo "Creating .env file..."
            cat > .env << 'EOF'
          # Database Configuration
          POSTGRES_DB=ila_db
          POSTGRES_USER=ila_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT=5432
          # Application Configuration
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=https://${{ env.DOMAIN }}

          # Email Configuration (SMTP)
          SMTP_HOST=${{ secrets.SMTP_HOST }}
          SMTP_PORT=${{ secrets.SMTP_PORT }}
          SMTP_SECURE=${{ secrets.SMTP_SECURE }}
          SMTP_USER=${{ secrets.SMTP_USER }}
          SMTP_PASS=${{ secrets.SMTP_PASS }}

          # Google OAuth Configuration
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID_PROD }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET_PROD }}
          BACKEND_PUBLIC_URL=https://${{ env.DOMAIN }}
          FRONTEND_BASE_URL=https://${{ env.DOMAIN }}

          # Port Configuration
          FRONTEND_PORT=80
          BACKEND_PORT=3001

          # Production Database URL
          DATABASE_URL=postgresql://ila_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/ila_db

          # API Base URL - Use HTTPS with domain (nginx will proxy /api to backend:3001)
          VITE_API_BASE_URL=https://${{ env.DOMAIN }}/api

          # AI / OpenAI Configuration
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          EOF
            
            echo ""
            echo "============================================"
            echo "Step 9: Clean up Docker resources"
            echo "============================================"
            echo "Stopping existing containers..."
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true
            
            echo "Removing dangling images..."
            sudo docker image prune -f || true
            
            echo "Removing unused containers..."
            sudo docker container prune -f || true
            
            echo "Removing unused volumes..."
            sudo docker volume prune -f || true
            
            echo "Removing build cache..."
            sudo docker builder prune -f || true
            
            echo "Current disk usage:"
            df -h
            
            echo ""
            echo "============================================"
            echo "Step 10: Build Docker images"
            echo "============================================"
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
            
            echo ""
            echo "============================================"
            echo "Step 11: Start containers"
            echo "============================================"
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            echo ""
            echo "============================================"
            echo "Step 12: Wait for services to be healthy"
            echo "============================================"
            echo "Waiting for all services to complete startup (including migrations)..."
            
            # Wait for services to be healthy using docker compose wait (more reliable)
            timeout=60
            elapsed=0
            echo "Checking service health..."
            
            while [ $elapsed -lt $timeout ]; do
              if sudo docker compose ps | grep -q "(healthy)"; then
                echo "✅ Services are healthy!"
                break
              fi
              echo "Waiting for services... ($elapsed/$timeout seconds)"
              sleep 5
              elapsed=$((elapsed + 5))
            done
            
            echo "Final container status:"
            sudo docker compose ps
            
            # Show backend logs for verification
            echo ""
            echo "Recent backend logs:"
            sudo docker compose logs --tail=20 backend
            
            echo ""
            echo "============================================"
            echo "Step 13: Clean up old Docker resources"
            echo "============================================"
            echo "Removing dangling images..."
            sudo docker image prune -af --filter "until=24h"
            
            echo "Final disk usage:"
            df -h
            
            echo ""
            echo "============================================"
            echo "Deployment completed successfully!"
            echo "============================================"
            echo "Container status:"
            sudo docker compose ps
            
            echo ""
            echo "Application URLs:"
            echo "Frontend: http://${{ env.EC2_HOST }}:3000"
            echo "Backend API: http://${{ env.EC2_HOST }}:3001"
            echo "============================================"
          ENDSSH

      - name: Verify Deployment
        run: |
          echo "Waiting for services to start..."
          sleep 15

          # Check if backend is responding
          echo "Checking backend health..."
          curl -f http://${{ env.EC2_HOST }}:3001/health || echo "⚠️ Backend health check failed"

          # Check if frontend is responding
          echo "Checking frontend..."
          curl -f -I http://${{ env.EC2_HOST }} || echo "⚠️ Frontend health check failed"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ env.EC2_HOST }}"
          echo "🔌 Backend: http://${{ env.EC2_HOST }}:3001/api"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."

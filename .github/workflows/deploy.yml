name: Deploy to AWS EC2

on:
  push:
    branches:
      - main  # Trigger on push to main branch
  workflow_dispatch:  # Allow manual trigger

env:
  EC2_HOST: 13.212.19.144
  EC2_USER: ec2-user
  DEPLOY_PATH: /home/ec2-user/ila-webapp

jobs:
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.EC2_HOST }} >> ~/.ssh/known_hosts

      - name: Test SSH Connection
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} "echo 'SSH connection successful'"

      - name: Deploy Application
        run: |
          ssh -i ~/.ssh/id_rsa ${{ env.EC2_USER }}@${{ env.EC2_HOST }} << 'ENDSSH'
            set -e
            
            echo "============================================"
            echo "Starting Deployment Process"
            echo "============================================"
            
            echo ""
            echo "============================================"
            echo "Step 1: System Updates"
            echo "============================================"
            sudo dnf update -y
            
            echo ""
            echo "============================================"
            echo "Step 2: Install Git"
            echo "============================================"
            if ! command -v git &> /dev/null; then
              echo "Installing Git..."
              sudo dnf install -y git
              echo "Git installed: $(git --version)"
            else
              echo "Git already installed: $(git --version)"
            fi
            
            echo ""
            echo "============================================"
            echo "Step 3: Install Docker"
            echo "============================================"
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              sudo dnf install -y docker
              sudo systemctl enable docker
              sudo systemctl start docker
              echo "Docker installed: $(docker --version)"
            else
              echo "Docker already installed: $(docker --version)"
              # Ensure Docker is running
              sudo systemctl start docker || true
            fi
            
            echo ""
            echo "============================================"
            echo "Step 4: Verify Docker Compose"
            echo "============================================"
            if sudo docker compose version &> /dev/null; then
              echo "Docker Compose already available: $(sudo docker compose version)"
            else
              echo "Docker Compose not found, trying to install plugin..."
              sudo dnf install -y docker-compose-plugin || {
                echo "Plugin not available in repos, Docker Compose v2 should be bundled with Docker"
                echo "Checking if docker compose works..."
                sudo docker compose version || echo "Docker Compose installation may need manual intervention"
              }
            fi
            
            echo ""
            echo "============================================"
            echo "Step 5: Configure Docker permissions"
            echo "============================================"
            sudo usermod -aG docker ec2-user || true
            echo "ec2-user added to docker group"
            
            echo ""
            echo "============================================"
            echo "Step 6: Create deployment directory"
            echo "============================================"
            sudo mkdir -p ${{ env.DEPLOY_PATH }}
            sudo chown -R ec2-user:ec2-user ${{ env.DEPLOY_PATH }}
            echo "Deployment directory ready: ${{ env.DEPLOY_PATH }}"
            
            echo ""
            echo "============================================"
            echo "Step 7: Clone or update repository"
            echo "============================================"
            cd ${{ env.DEPLOY_PATH }}
            
            # Pull latest changes or clone repository
            if [ -d ".git" ]; then
              echo "Repository exists, pulling latest changes..."
              git fetch origin
              git reset --hard origin/main
              git pull origin main
            else
              echo "Cloning repository..."
              git clone https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git .
            fi
            
            echo ""
            echo "============================================"
            echo "Step 8: Set up environment variables"
            echo "============================================"
            if [ ! -f ".env" ]; then
              echo "Creating .env file..."
              cat > .env << 'EOF'
          # Database Configuration
          POSTGRES_DB=ila_db
          POSTGRES_USER=ila_user
          POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_PORT=5432

          # Application Configuration
          NODE_ENV=production
          JWT_SECRET=${{ secrets.JWT_SECRET }}
          CORS_ORIGIN=http://${{ env.EC2_HOST }}:3000

          # Port Configuration
          FRONTEND_PORT=3000
          BACKEND_PORT=3001

          # Production Database URL
          DATABASE_URL=postgresql://ila_user:${{ secrets.POSTGRES_PASSWORD }}@postgres:5432/ila_db

          # API Base URL
          VITE_API_BASE_URL=http://${{ env.EC2_HOST }}:3001/api
          EOF
            fi
            
            echo ""
            echo "============================================"
            echo "Step 9: Stop existing containers"
            echo "============================================"
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml down || true
            
            echo ""
            echo "============================================"
            echo "Step 10: Build Docker images"
            echo "============================================"
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml build --no-cache
            
            echo ""
            echo "============================================"
            echo "Step 11: Start containers"
            echo "============================================"
            sudo docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
            
            echo ""
            echo "============================================"
            echo "Step 12: Clean up old images"
            echo "============================================"
            sudo docker image prune -f
            
            echo ""
            echo "============================================"
            echo "Deployment completed successfully!"
            echo "============================================"
            echo "Container status:"
            sudo docker compose ps
            
            echo ""
            echo "Application URLs:"
            echo "Frontend: http://${{ env.EC2_HOST }}:3000"
            echo "Backend API: http://${{ env.EC2_HOST }}:3001"
            echo "============================================"
          ENDSSH

      - name: Verify Deployment
        run: |
          echo "Waiting for services to start..."
          sleep 15
          
          # Check if backend is responding
          echo "Checking backend health..."
          curl -f http://${{ env.EC2_HOST }}:3001/health || echo "⚠️ Backend health check failed"
          
          # Check if frontend is responding
          echo "Checking frontend..."
          curl -f -I http://${{ env.EC2_HOST }}:3000 || echo "⚠️ Frontend health check failed"

      - name: Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment successful!"
          echo "🌐 Frontend: http://${{ env.EC2_HOST }}:3000"
          echo "🔌 Backend: http://${{ env.EC2_HOST }}:3001/api"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ Deployment failed! Check the logs above for details."
